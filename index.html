<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon home page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
      integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="navbar">

      <div class="logo "></div>
      <div class="location border">
            <div class="deliver"><p>Deliver to</p></div>
            <div class="update">
                <div class="icon"><i class="fa fa-map-marker"></i></div>
                <p>Update location</p>
            </div>
      </div>

      <div class="search active" >
            <select name="select active" id="">
                <option value="ALL" selected>All</option>
                <option value="All Categories">All Categories</option>
                <option value="alexa skills" >alexa skills</option>
            </select>
            <input class=" active" type="search" placeholder="Search Amazon.in">
            <div class="searchicon"> <i class="fa fa-search"></i></div>
      </div>

      <div class="account border">
        <p>Hello, Sign in</p>
        <select>
            <option selected> Accounts & Lists</option>
        </select>
      </div>

      <div class="ret border">
        <p class="returns">Returns</p>
        <p class="orders">& Orders</p>
        
      </div>

      <div class="cart border">
        <i class="fa fa-shopping-cart" aria-hidden="true"></i>


        <p>Cart</p>
      </div>

    </div>
  </body>
</html>
